name: Sync privacyguides/verified-apps database

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  attestations: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify verified-apps database
        uses: privacyguides/verified-apps@07e8c098700d30cda21d01a661215134cf9a0e88
        with:
          source: main
          fallback: commit

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Replace internal database from data.yml
        run: python .github/scripts/generate_internal_db.py --data-yml "$RUNNER_TEMP/data.yml"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/privacyguides/verifiedapps/InternalVerificationInfoDatabase.kt
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit \
              -m "Sync internal database from privacyguides/verified-apps" \
              -m "Replace InternalVerificationInfoDatabase.kt with data from privacyguides/verified-apps main/data.yml (attestation-verified)." \
              -m "Co-authored-by: Privacy Guides [bot] <github-bot@privacyguides.net>"
            git push
          fi
