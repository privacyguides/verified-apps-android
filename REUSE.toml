version = 1

# Files that cannot carry a comment header: lockfiles, store metadata, images,
# SOPS-encrypted secrets (MAC-protected), and IDE-managed files.
[[annotations]]
path = [
  ".idea/.name",
  ".idea/deviceManager.xml",
  ".idea/markdown.xml",
  ".idea/planningMode.xml",
  ".idea/studiobot.xml",
  "Gemfile.lock",
  "fastlane/metadata/**",
  "secrets/*.yaml",
]
SPDX-FileCopyrightText = "2026 Jonah Aragon"
SPDX-License-Identifier = "MIT"

# IDE settings unchanged since the fork from the upstream project, AppVerifier
# (https://github.com/soupslurpr/AppVerifier).
[[annotations]]
path = [
  ".idea/.gitignore",
  ".idea/AndroidProjectSystem.xml",
  ".idea/codeStyles/**",
  ".idea/inspectionProfiles/**",
  ".idea/kotlinc.xml",
  ".idea/migrations.xml",
  ".idea/runConfigurations.xml",
  ".idea/uiDesigner.xml",
  ".idea/vcs.xml",
]
SPDX-FileCopyrightText = "2024-2025 soupslurpr"
SPDX-License-Identifier = "ISC"

# IDE and Gradle wrapper settings that still contain content from AppVerifier
# and have been changed since the fork.
[[annotations]]
path = [
  ".idea/compiler.xml",
  ".idea/gradle.xml",
  ".idea/misc.xml",
  "gradle/wrapper/gradle-wrapper.properties",
]
SPDX-FileCopyrightText = ["2024-2025 soupslurpr", "2026 Jonah Aragon"]
SPDX-License-Identifier = "ISC AND MIT"

# Generated by .github/scripts/generate_internal_db.py, which rewrites the whole
# file. The code structure comes from AppVerifier and this project; the entries
# come from https://github.com/privacyguides/verified-apps (CC-BY-4.0).
[[annotations]]
path = "app/src/main/kotlin/org/privacyguides/verifiedapps/InternalVerificationInfoDatabase.kt"
SPDX-FileCopyrightText = [
  "2024-2025 soupslurpr",
  "2026 Jonah Aragon",
  "2026 Privacy Guides & contributors",
]
SPDX-License-Identifier = "ISC AND MIT AND CC-BY-4.0"

# Gradle wrapper, distributed by the Gradle project. The wrapper scripts
# (gradlew, gradlew.bat) carry their own Apache-2.0 header.
[[annotations]]
path = "gradle/wrapper/gradle-wrapper.jar"
SPDX-FileCopyrightText = "2015 the original author or authors"
SPDX-License-Identifier = "Apache-2.0"
